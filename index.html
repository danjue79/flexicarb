<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>31 — Flexi-Carb</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141E2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="31">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#141E2A; --surf:#1D2B3A; --surf2:#26394C; --line:#33495F;
  --chalk:#EAF0F6; --mute:#8AA1B8;
  --amber:#F2A03D; --mint:#5FD3A8; --rose:#E9736B;
  --disp:"Avenir Next Condensed","Futura","Helvetica Neue",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --data:"Menlo","SF Mono",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);
  font-size:16px;line-height:1.45;overscroll-behavior:none;
  padding-bottom:calc(72px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- structure ---------- */
.wrap{padding:0 18px;max-width:560px;margin:0 auto}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.16em;
  font-size:12px;color:var(--mute);font-weight:600}
h1{font-family:var(--disp);font-size:38px;line-height:1.05;font-weight:700;
  letter-spacing:-.01em;margin:2px 0 0}
h2{font-family:var(--disp);text-transform:uppercase;letter-spacing:.13em;
  font-size:13px;color:var(--mute);font-weight:600;margin:26px 0 10px}
.head{padding:calc(env(safe-area-inset-top,0px) + 22px) 0 4px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:12px}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.hide{display:none!important}

/* ---------- today ---------- */
.badge{display:inline-block;font-family:var(--disp);text-transform:uppercase;
  letter-spacing:.14em;font-size:11px;font-weight:700;padding:5px 10px;
  border-radius:99px;margin-bottom:12px}
.badge.train{background:rgba(242,160,61,.16);color:var(--amber)}
.badge.rest{background:rgba(95,211,168,.14);color:var(--mint)}
.badge.mob{background:rgba(233,115,107,.15);color:var(--rose)}
.hr{background:var(--surf2);border-radius:12px;padding:12px;text-align:center;margin-top:14px}
.hr b{display:block;font-family:var(--data);font-size:22px;font-weight:600;color:var(--mint)}
.hr span{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--mute)}
.hr.ghost{border:1px dashed var(--line);background:none;cursor:pointer}
.hr.ghost b{color:var(--mute);font-size:15px}
.hrlive{margin-top:18px;padding:12px 22px;border-radius:14px;border:1px solid var(--line);
  min-width:150px;background:var(--surf)}
.hrlive b{display:block;font-family:var(--data);font-size:40px;font-weight:600;line-height:1}
.hrlive span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.hrlive.off b{color:var(--mute);font-size:30px}
.hrlive.in{border-color:var(--mint)} .hrlive.in b{color:var(--mint)}
.hrlive.low{border-color:var(--line)} .hrlive.low b{color:var(--chalk)}
.hrlive.high{border-color:var(--rose)} .hrlive.high b{color:var(--rose)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.macro{background:var(--surf);padding:11px 6px;text-align:center}
.macro b{display:block;font-family:var(--data);font-size:17px;font-weight:600}
.macro span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.go{display:block;width:100%;background:var(--amber);color:#14202C;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;
  font-weight:700;font-size:17px;padding:17px;border-radius:14px;margin-top:6px}
.go:active{transform:scale(.985)}
.go.ghost{background:none;border:1px solid var(--line);color:var(--chalk)}

/* ---------- exercise rows ---------- */
.pair{border-left:2px solid var(--line);padding-left:13px;margin-bottom:16px}
.pair.p1{border-color:var(--amber)}
.ex{display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;padding:7px 0}
.ex b{font-weight:600;font-size:15px}
.ex .t{font-family:var(--data);font-size:13px;color:var(--mute);white-space:nowrap}

/* ---------- runner ---------- */
#runner{position:fixed;inset:0;background:var(--ink);z-index:50;
  display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 var(--safe-b)}
.rbar{height:3px;background:var(--surf2)}
.rbar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.rtop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.rmid{flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:16px 22px}
.rmid .lbl{font-family:var(--disp);text-transform:uppercase;letter-spacing:.18em;
  font-size:12px;color:var(--mute);margin-bottom:14px}
.rmid .exname{font-family:var(--disp);font-size:36px;line-height:1.1;font-weight:700}
.rmid .target{font-family:var(--data);font-size:15px;color:var(--amber);margin-top:12px}
.clock{font-family:var(--data);font-size:76px;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.clock.soon{color:var(--amber)}
.next{font-size:14px;color:var(--mute);margin-top:18px}
.next b{color:var(--chalk);font-weight:600}
.queue{margin-top:22px;max-width:340px;font-size:11.5px;line-height:1.8;
  color:var(--mute);letter-spacing:.02em}
.queue .qlbl{text-transform:uppercase;letter-spacing:.14em;font-size:9.5px;opacity:.55;margin-right:7px}
.queue em{font-style:normal;opacity:.7}
.queue .sep{margin:0 6px;opacity:.45}
.queue .last-item{font-style:italic;opacity:.7}
.wl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);opacity:.75}
.vol{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surf2);
  border-radius:11px;padding:4px;margin-top:12px}
.vol button{padding:9px;border-radius:8px;font-size:13px;color:var(--mute)}
.vol button.on{background:var(--surf);color:var(--chalk);font-weight:600}
.rbot{padding:0 18px 16px;display:grid;gap:9px}
.logrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.field label{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--mute)}
.field input{width:100%;background:none;border:none;outline:none;color:var(--chalk);
  font-family:var(--data);font-size:21px;font-weight:600}
.last{font-size:12px;color:var(--mute);text-align:center}
.skip{width:100%;padding:13px;font-size:14px;color:var(--mute);
  border:1px solid var(--line);border-radius:12px;background:none}
.sheet{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 22px}
.reason{display:block;width:100%;text-align:left;background:var(--surf);
  border:1px solid var(--line);border-radius:13px;padding:15px 16px;
  margin-bottom:9px;font-size:15.5px}
.reason:active{background:var(--surf2)}
.reason.warn{border-color:rgba(233,115,107,.45);color:var(--rose)}
.reason.swap{border-color:var(--amber)}
.reason.swap b{color:var(--amber);font-size:15.5px}
.reason.swap span{font-size:12.5px;color:var(--mute)}
.rir{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.rir button{background:var(--amber);color:#14202C;border-radius:13px;padding:13px 4px;text-align:center}
.rir button:nth-child(1){background:var(--surf2);color:var(--chalk)}
.rir button:nth-child(3){background:var(--surf2);color:var(--chalk)}
.rir b{display:block;font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.02em}
.rir span{font-size:9.5px;opacity:.72;letter-spacing:.06em}
.last.up{color:var(--mint)} .last.down{color:var(--rose)}
.shift{margin-top:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shift .eyebrow{flex:1 0 100%;margin-bottom:2px}
.shift button{border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--mute)}
.card.dl{border-color:var(--amber);background:rgba(242,160,61,.08)}
.habits{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.hb{background:var(--surf2);border:1px solid var(--line);border-radius:13px;
  padding:11px 3px 9px;text-align:center}
.hb i{display:block;font-style:normal;font-size:15px;height:19px;line-height:19px;color:transparent}
.hb b{display:block;font-size:12.5px;font-weight:600}
.hb span{font-size:9.5px;color:var(--mute);letter-spacing:.03em}
.hb.on{background:rgba(95,211,168,.14);border-color:var(--mint)}
.hb.on i{color:var(--mint)}
.hb.on b{color:var(--mint)}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow:last-of-type{border:none}
.hmeta{width:74px;flex:none}
.hmeta b{display:block;font-size:13.5px;font-weight:600}
.hmeta span{font-size:10px;color:var(--mute)}
.hdots{flex:1;display:flex;gap:2px;align-items:center}
.hdots i{flex:1;height:15px;border-radius:2px;background:var(--surf2)}
.hdots i.on{background:var(--mint)}
.hdots i.off{background:var(--line)}
.hdots i.na{background:transparent;border:1px solid var(--surf2)}
.hpct{width:52px;flex:none;text-align:right;font-family:var(--data);font-size:14px;font-weight:600}
.hpct em{display:block;font-style:normal;font-size:9px;color:var(--mute);font-weight:400}
.hpct.good{color:var(--mint)} .hpct.mid{color:var(--amber)} .hpct.low{color:var(--rose)}
#hist{position:fixed;inset:0;background:var(--ink);z-index:60;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) 0 var(--safe-b)}
.histbody{flex:1;overflow-y:auto;padding:0 18px 30px;max-width:560px;margin:0 auto;width:100%}
.histseg{grid-template-columns:repeat(5,1fr);gap:3px}
.histseg button{padding:9px 2px;font-size:11px;letter-spacing:.04em}
#hist h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.13em;
  font-size:12px;color:var(--mute);font-weight:600;margin:24px 0 10px}
.cal{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.calhead,.calrow{display:grid;grid-template-columns:42px repeat(7,1fr);gap:4px;align-items:center}
.calhead{margin-bottom:6px}
.calhead span{text-align:center;font-size:9.5px;letter-spacing:.09em;color:var(--mute);
  text-transform:uppercase;font-family:var(--disp);font-weight:600}
.calrow{margin-bottom:4px}
.wk{font-family:var(--data);font-size:9.5px;color:var(--mute)}
.cell{height:26px;border-radius:5px;background:var(--surf2);display:flex;align-items:center;
  justify-content:center;font-family:var(--data);font-size:11px;color:var(--mute);cursor:pointer}
.cell.na{background:none;border:1px solid rgba(51,73,95,.35);cursor:default}
.cell.on{background:var(--mint)}
.cell.off{background:var(--line)}
.cell.empty{background:var(--surf2)}
.cell.s0{background:var(--surf2)}
.cell.s1{background:rgba(95,211,168,.22);color:var(--chalk)}
.cell.s2{background:rgba(95,211,168,.42);color:var(--chalk)}
.cell.s3{background:rgba(95,211,168,.66);color:#14202C}
.cell.s4{background:var(--mint);color:#14202C;font-weight:700}
.cell.pick{outline:2px solid var(--amber);outline-offset:1px}
.wdbars,.wtrend{display:flex;gap:5px;align-items:flex-end;background:var(--surf);
  border:1px solid var(--line);border-radius:14px;padding:12px}
.wdb,.wt{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.wdb i,.wt i{width:100%;background:var(--mint);border-radius:3px;opacity:.85;min-height:4px}
.wdbars{height:132px} .wtrend{height:120px}
.wdb{height:100%;justify-content:flex-end} .wt{height:100%;justify-content:flex-end}
.wdb i.worst{background:var(--rose)}
.wdb b,.wt span{font-size:10px;color:var(--mute);font-weight:600;font-family:var(--data)}
.wdb span{font-size:9px;color:var(--mute)}
.hint{font-size:12.5px;color:var(--mute);margin-top:10px;line-height:1.55}
.hint b{color:var(--chalk)}
.ovw{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ov{background:var(--surf);border:1px solid var(--line);border-radius:13px;
  padding:14px 4px;text-align:center;cursor:pointer}
.ov b{display:block;font-family:var(--data);font-size:19px;font-weight:600}
.ov span{font-size:10px;color:var(--mute)}
.ov.good b{color:var(--mint)} .ov.mid b{color:var(--amber)} .ov.low b{color:var(--rose)}

/* ---------- meals ---------- */
.meal{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border:none}
.meal .when{font-family:var(--data);font-size:12px;color:var(--amber);
  min-width:52px;padding-top:2px}
.meal .what{flex:1;font-size:14.5px}
.meal .kcal{font-family:var(--data);font-size:12px;color:var(--mute);white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surf);
  border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{padding:9px;border-radius:9px;font-family:var(--disp);font-size:13px;
  text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--surf2);color:var(--chalk)}

/* ---------- weight ---------- */
.spark{display:flex;align-items:flex-end;gap:3px;height:76px;margin:14px 0 4px}
.spark i{flex:1;background:var(--surf2);border-radius:2px;min-height:2px}
.spark i.last{background:var(--amber)}
.wrow{display:flex;justify-content:space-between;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);
  border-radius:12px;overflow:hidden}
.stat div{background:var(--surf);padding:13px 6px;text-align:center}
.stat b{display:block;font-family:var(--data);font-size:19px;font-weight:600}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}

/* ---------- tabs ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(20,30,42,.93);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:11px 0 13px;font-family:var(--disp);font-size:11px;
  text-transform:uppercase;letter-spacing:.11em;font-weight:600;color:var(--mute)}
nav button.on{color:var(--amber)}
nav button i{display:block;font-size:19px;font-style:normal;margin-bottom:2px;opacity:.85}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main id="app"></main>

<nav>
  <button data-tab="heute" class="on"><i>◐</i>Heute</button>
  <button data-tab="plan"><i>≡</i>Plan</button>
  <button data-tab="essen"><i>◍</i>Essen</button>
  <button data-tab="werte"><i>◇</i>Werte</button>
</nav>

<div id="runner" class="hide"></div>
<div id="hist" class="hide"></div>

<script>
/* =======================================================================
   DATEN — hier änderst du deinen Plan
   ======================================================================= */

    { id:"2", rest:75, ex:[

      {n:"Latzug weit", t:"3 × 8–12", w:40, k:"stack", inc:2.5, alt:{n:"Klimmzug breit", w:0, k:"bw", inc:2.5}}], rounds:3 }
  ]}
};
const SWITCH = 15;                       // Sekunden Wechsel innerhalb des Paares
// So, Mo, Di, Mi, Do, Fr, Sa
const WEEK = [
  {t:"frei"},
  {t:"kraft", k:"A"},
  {t:"zone2", min:40},
  {t:"kraft", k:"B"},
  {t:"mob"},
  {t:"kraft", k:"C"},
  {t:"zone2", min:45, alt:"int"}
];

const CARDIO = {
  zone2:{
    name:"Zone 2",
    was:"Rad, Crosstrainer, Ruderergometer oder zügiges Gehen mit Steigung.",
    regel:"Du musst durchgehend in ganzen Sätzen sprechen können. Geht das nicht mehr, bist du zu schnell — das ist der zuverlässigste Test, auch ohne Pulsgurt.",

  },
  int:{
    name:"Intervalle",
    was:"6–8 × 30 s hart / 90 s locker, davor 5 min ein-, danach 5 min ausrollen.",
    regel:"Die harten 30 s sind wirklich hart — Sprechen unmöglich. Nur samstags, nie am Tag vor einer Krafteinheit.",
    pct:[0.88,1.00]
  }
};

// Mobility: Gegengewicht zu Schreibtisch + schweren Grundübungen
const MOB = [
  {n:"Katze – Kuh",            sec:45, c:"Vierfüßler. Wirbel für Wirbel rollen, Atmung mitlaufen lassen."},
  {n:"90/90 Hüftwechsel",      sec:60, c:"Im Sitzen beide Knie 90°, langsam von Seite zu Seite. Öffnet die Hüfte für die Kniebeuge."},
  {n:"Couch Stretch links",    sec:60, c:"Hinteres Knie an der Wand, Becken aufrichten. Für den verkürzten Hüftbeuger vom Sitzen."},
  {n:"Couch Stretch rechts",   sec:60, c:"Gleiche Seite wechseln. Nicht ins Hohlkreuz ausweichen."},
  {n:"Adduktoren-Rocking",     sec:45, c:"Vierfüßler, ein Bein seitlich gestreckt, langsam nach hinten schaukeln."},
  {n:"Open Book links",        sec:45, c:"Seitlage, Knie oben angewinkelt, oberen Arm aufdrehen. Brustwirbelsäule, nicht Lendenwirbelsäule."},
  {n:"Open Book rechts",       sec:45, c:"Seite wechseln. Blick folgt der Hand."},
  {n:"Schulterkreisen am Band",sec:45, c:"Band oder Besenstiel weit fassen, gestreckt über den Kopf nach hinten. Für Schulterdrücken und Frontkniebeuge."},
  {n:"Wadendehnung links",     sec:40, c:"Ferse am Boden, Knie einmal gestreckt, einmal leicht gebeugt."},
  {n:"Wadendehnung rechts",    sec:40, c:"Seite wechseln."},
  {n:"Bird Dog",               sec:60, c:"Gegengleich Arm und Bein strecken, Becken ruhig halten. Im Wechsel."},
  {n:"Dead Bug",               sec:60, c:"Rückenlage, Lendenwirbelsäule bleibt am Boden. Langsam, kontrolliert."}
];

// Quote der letzten n Tage — bewusst keine Serie, siehe Erläuterung im Chat
function habitRate(id, n){
  const out = {done:0, total:0};
  for(let i = 0; i < n; i++){
    const dt = new Date(today()); dt.setDate(dt.getDate() - i);
    const k = iso(dt);
    if(new Date(k) < new Date(firstHabitDay())) continue;
    out.total++; if(habitDay(k)[id]) out.done++;
  }
  return out;
}
const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const mondayOf = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x };

// Wochenblöcke vom ersten erfassten Tag bis heute, jeweils Mo–So
function histWeeks(){
  const first = mondayOf(new Date(firstHabitDay()));
  const last  = mondayOf(today());
  const out = [];
  for(let m = new Date(first); m <= last; m.setDate(m.getDate()+7)){
    const days = [];
    for(let i = 0; i < 7; i++){
      const d = new Date(m); d.setDate(m.getDate()+i);
      days.push({k: iso(d), future: d > today(), before: iso(d) < firstHabitDay()});
    }
    out.push({mon: new Date(m), days});
  }
  return out.slice(-12);
}
// Quote je Wochentag — zeigt, wo es systematisch bricht
function weekdayRate(id){
  const acc = WD.map(() => ({done:0, total:0}));
  Object.keys(habits).forEach(k => {
    const i = (new Date(k).getDay()+6)%7;
    acc[i].total++; if(habits[k][id]) acc[i].done++;
  });
  return acc;
}
function weekRate(id, week){
  let done = 0, total = 0;
  week.days.forEach(d => {
    if(d.future || d.before) return;
    total++; if(habitDay(d.k)[id]) done++;
  });
  return {done, total};
}
function dayScore(k){
  return HABITS.reduce((a,h) => a + (habitDay(k)[h.id] ? 1 : 0), 0);
}

function firstHabitDay(){
  const ks = Object.keys(habits).sort();
  return ks.length ? ks[0] : iso(today());
}    // [{d, k, ex, reason, sets}]

// Obere Wiederholungszahl aus der Zielvorgabe, z. B. "4 × 5–8" -> 8
function topReps(t){
  const m = (t||"").match(/(\d+)\s*[–-]\s*(\d+)/);
  return m ? parseInt(m[2]) : null;
}
/* Steigerungsvorschlag nach der doppelten Progression:
   obere Wiederholungszahl bei Ziel-RIR in allen Sätzen erreicht -> Gewicht hoch.
   Zweimal dasselbe Gewicht ohne Erreichen -> 10 % runter und neu hocharbeiten. */
function suggest(ex){
  const l = lifts[ex.n];
  if(!l || !l.h || !l.h.length) return {w: ex.w, why:"Startvorschlag"};
  const top = topReps(ex.t), inc = ex.inc || 2.5;
  const days = [...new Set(l.h.map(x => x.d))].slice(-3);
  const lastDay = days[days.length-1];
  const sets = l.h.filter(x => x.d === lastDay);
  const minR = Math.min(...sets.map(x => x.r));
  const w = sets[sets.length-1].w;
  const maxRir = Math.max(...sets.map(x => x.rir ?? 2));
  if(top && minR >= top && maxRir <= 3){
    const step = maxRir >= 3 ? inc * 2 : inc;      // ging leicht -> zwei Stufen
    return {w: w + step, why: `letzte ${w} kg × ${minR}${maxRir>=3?", ging leicht":""}`, up:true};
  }
  // Stagnation: zwei Einheiten gleiches Gewicht ohne obere Wiederholungszahl
  if(days.length >= 2 && top){
    const prev = l.h.filter(x => x.d === days[days.length-2]);
    if(prev.length && prev[0].w === w && Math.min(...prev.map(x=>x.r)) < top && minR < top)
      return {w: Math.round(w * 0.9 / (ex.inc||2.5)) * (ex.inc||2.5),
              why: "zweimal gehalten — 10 % runter und neu hocharbeiten", down:true};
  }
  return {w, why: `letzte ${w} kg × ${minR}`};
}

  const done = DB.get("done", []);
  if(!done.length) return 1;
  const first = new Date(done[0].d);

}

function drawHist(){
  const weeks = histWeeks();
  const sel = HABITS.find(x => x.id === histSel);
  const de = k => new Date(k).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});

  // Kalender
  let cal = `<div class="cal"><div class="calhead"><span></span>${WD.map(w=>`<span>${w}</span>`).join("")}</div>`;
  weeks.forEach(w => {
    cal += `<div class="calrow"><span class="wk">${w.mon.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</span>`;
    w.days.forEach(d => {
      if(d.future || d.before){ cal += `<span class="cell na"></span>`; return }
      if(sel){
        const on = !!habitDay(d.k)[sel.id];
        cal += `<span class="cell ${on?"on":(habits[d.k]?"off":"empty")}" onclick="histTap('${d.k}')"></span>`;
      } else {
        const sc = dayScore(d.k);
        cal += `<span class="cell s${sc}${histDay===d.k?" pick":""}" onclick="histTap('${d.k}')">${sc||""}</span>`;
      }
    });
    cal += `</div>`;
  });
  cal += `</div>`;

  // Wochentagsmuster + Wochentrend (nur bei einzelner Gewohnheit)
  let detail = "";
  if(sel){
    const wr = weekdayRate(sel.id);
    const valid = wr.map((x,i)=>({i, p: x.total ? x.done/x.total : null})).filter(x => x.p !== null);
    const worst = valid.length > 2 ? valid.reduce((a,b)=> b.p < a.p ? b : a) : null;
    const best  = valid.length > 2 ? valid.reduce((a,b)=> b.p > a.p ? b : a) : null;
    detail = `<h3>Nach Wochentag</h3><div class="wdbars">${wr.map((x,i) => {
      const p = x.total ? x.done/x.total : 0;
      return `<div class="wdb"><i style="height:${Math.max(4, p*100)}%" class="${worst&&worst.i===i?"worst":""}"></i>
        <b>${WD[i]}</b><span>${x.total?Math.round(p*100)+"%":"—"}</span></div>`;
    }).join("")}</div>
    ${worst && best && worst.i !== best.i
      ? `<p class="hint">Schwächster Tag: <b>${WD[worst.i]}</b> (${Math.round(worst.p*100)}%), stärkster: <b>${WD[best.i]}</b> (${Math.round(best.p*100)}%). Wenn das über mehrere Wochen bleibt, liegt es am Wochenrhythmus — nicht am Willen.</p>`
      : `<p class="hint">Für ein belastbares Wochentagsmuster braucht es etwa drei Wochen Daten.</p>`}
    <h3>Quote je Woche</h3><div class="wtrend">${weeks.map(w => {
      const r = weekRate(sel.id, w);
      const p = r.total ? r.done/r.total : 0;
      return `<div class="wt"><i style="height:${Math.max(4, p*100)}%"></i>
        <span>${r.total?r.done:"—"}</span></div>`;
    }).join("")}</div>
    <p class="hint">Balkenhöhe = Anteil erfüllter Tage, Zahl = Tage in der Woche. Links alt, rechts diese Woche.</p>`;
  } else if(histDay){
    const v = habitDay(histDay);
    detail = `<h3>${new Date(histDay).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"})}</h3>
      <div class="habits">${HABITS.map(h =>
        `<button class="hb${v[h.id]?" on":""}" onclick="toggleHabitSilent('${h.id}','${histDay}');drawHist()">
          <i>${v[h.id]?"✓":""}</i><b>${h.t}</b><span>${h.z}</span></button>`).join("")}</div>
      <p class="hint">Nachtragen ist ausdrücklich erlaubt — lückenhafte Daten sind schlechter als spät eingetragene.</p>`;
  } else {
    const tot = Object.keys(habits).length;
    const full = Object.keys(habits).filter(k => dayScore(k) === 4).length;
    detail = `<h3>Überblick</h3>
      <div class="ovw">${HABITS.map(h => {
        const r = habitRate(h.id, 28), p = r.total ? Math.round(r.done/r.total*100) : 0;
        return `<div class="ov ${p>=80?"good":p>=60?"mid":"low"}" onclick="histPick('${h.id}')">
          <b>${p}%</b><span>${h.t}</span></div>`;
      }).join("")}</div>
      <p class="hint">${tot} Tage erfasst, davon ${full} mit allen vier Haken.
      Tippe eine Kachel für Details oder einen Tag im Kalender zum Nachtragen.
      Die Zahl im Kalender zeigt, wie viele der vier an dem Tag erfüllt waren.</p>`;
  }

  HB.innerHTML = `<div class="rtop"><button class="eyebrow" onclick="closeHist()">Zurück</button>
      <span class="eyebrow">Verlauf</span></div>
    <div class="histbody">
      <div class="seg histseg">
        <button class="${histSel==="all"?"on":""}" onclick="histPick('all')">Alle</button>
        ${HABITS.map(h => `<button class="${histSel===h.id?"on":""}" onclick="histPick('${h.id}')">${h.t}</button>`).join("")}
      </div>
      ${cal}${detail}
    </div>`;
}

}

function weekAvgs(){
  // Wochenmittel, neueste Woche zuletzt
  const by = {};
  weights.forEach(w => {
    const dt = new Date(w.d);
    const th = new Date(dt); th.setDate(dt.getDate() + 3 - ((dt.getDay()+6)%7));
    const k = iso(th).slice(0,10);
    (by[k] = by[k] || []).push(w.kg);
  });
  return Object.keys(by).sort().map(k => ({
    k, avg: by[k].reduce((a,b)=>a+b,0)/by[k].length, n: by[k].length }));
}

function buildReport(){
  const de = d => new Date(d).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  const L = [];
  L.push("FLEXI-CARB — STANDSBERICHT " + de(today()) + " · Trainingswoche " + trainWeek() + (isDeload()?" (Deload)":""));
  L.push("");

  // Gewicht
  L.push("GEWICHT");
  if(weights.length){
    const first = weights[0], a = avg7();
    L.push(`Start ${first.kg.toFixed(1)} kg (${de(first.d)}) | 7-Tage-Ø aktuell ${a.toFixed(2)} kg | Δ ${(a-first.kg>=0?"+":"")}${(a-first.kg).toFixed(1)} kg`);
    const wa = weekAvgs().slice(-6);
    L.push("Wochenmittel: " + wa.map(x => x.avg.toFixed(1) + (x.n<4?"*":"")).join(" → "));
    if(wa.some(x=>x.n<4)) L.push("(* Woche mit weniger als 4 Messungen)");
  } else L.push("noch keine Einträge");
  L.push("");

  // Training
  L.push("TRAINING (Gewicht × Wdh., neueste zuerst)");
  const ent = Object.entries(lifts);
  if(ent.length){
    ent.forEach(([n,l]) => {
      const seen = {}, uniq = [];
      (l.h||[{d:l.date,w:l.w,r:l.r,rir:l.rir}]).slice().reverse().forEach(x => {
        if(!seen[x.d]){ seen[x.d] = 1; uniq.push(x) } });
      const h = uniq.slice(0,5);
      const RIRT = {3:" leicht", 2:"", 0:" Grenze"};
      L.push(`${n}: ` + h.map(x => `${x.w}×${x.r}${RIRT[x.rir] ?? ""} (${x.d.slice(8,10)}.${x.d.slice(5,7)}.)`).join("  ←  "));
    });
  } else L.push("noch keine Sätze protokolliert");
  L.push("");

  // Einheiten
  const done = DB.get("done",[]);
  L.push("EINHEITEN");
  if(done.length){
    const first = new Date(done[0].d);
    const last = new Date(Math.max(new Date(done[done.length-1].d), today()));
    const weeks = Math.max(1, Math.round((last-first)/6048e5) + 1);
    L.push(`${done.length} absolviert in ${weeks} Wochen (Soll ${weeks*3}) — zuletzt Einheit ${done[done.length-1].k} am ${de(done[done.length-1].d)}`);
  } else L.push("noch keine abgeschlossen");
  L.push("");

  // Ausdauer & Mobility
  L.push("AUSDAUER & MOBILITY (letzte 4 Wochen)");
  const cut = new Date(today()); cut.setDate(cut.getDate()-28);
  const rec = cardioLog.filter(x => new Date(x.d) >= cut);
  if(rec.length){
    const NM = {zone2:"Zone 2", int:"Intervalle", mob:"Mobility"};
    ["zone2","int","mob"].forEach(k => {
      const r2 = rec.filter(x => x.t===k);
      if(!r2.length) return;
      const withHR = r2.filter(x => x.hr);
      const hrTxt = withHR.length
        ? ` — Ø Puls ${Math.round(withHR.reduce((a,b)=>a+b.hr,0)/withHR.length)} S/min`
          + (withHR.length > 2 ? ` (erste ${withHR[0].hr} → letzte ${withHR[withHR.length-1].hr})` : "")
        : "";
      L.push(`${NM[k]}: ${r2.length} ${r2.length===1?"Einheit":"Einheiten"}, ${r2.reduce((a,b)=>a+b.min,0)} Minuten gesamt${hrTxt}`);
    });
  } else L.push("nichts protokolliert");
  L.push("");

  L.push("ÜBERSPRUNGEN (letzte 4 Wochen)");
  const sk = skipLog.filter(x => new Date(x.d) >= cut);
  if(sk.length){
    const byEx = {};
    sk.forEach(x => { (byEx[x.ex] = byEx[x.ex] || []).push(x) });
    Object.entries(byEx).sort((a,b) => b[1].length - a[1].length).forEach(([ex, list]) => {
      const cnt = {};
      list.forEach(x => cnt[x.reason] = (cnt[x.reason]||0) + 1);
      const txt = Object.entries(cnt).map(([r,c]) => `${REASON_T[r]||r}${c>1?" "+c+"×":""}`).join(", ");
      L.push(`${ex}: ${list.length}× ausgelassen (${txt})`);
    });
  } else L.push("nichts ausgelassen");
  L.push("");

  L.push("GEWOHNHEITEN (Quote, 4 Wochen / letzte 7 Tage)");
  if(Object.keys(habits).length){
    HABITS.forEach(x => {
      const r28 = habitRate(x.id, 28), r7 = habitRate(x.id, 7);
      const pct = r28.total ? Math.round(r28.done / r28.total * 100) : 0;
      L.push(`${x.lang}: ${pct}% (${r28.done}/${r28.total}) — letzte Woche ${r7.done}/${r7.total}`);
    });
  } else L.push("nicht erfasst");
  L.push("");
  L.push("SUBJEKTIV (bitte ausfüllen)");
  L.push("Energie im Training: ");
  L.push("Schlaf: ");
  L.push("Hunger / Sättigung: ");
  L.push("Bauchumfang Nabelhöhe: ");
  L.push("Was hakt: ");
  return L.join("\n");
}

   RUNNER — Supersatz-Ablauf mit Pausen-Uhr
   ======================================================================= */
let run = null, tick = null;
const R = document.getElementById("runner");

function buildSteps(key){
  const s = PLAN[key], steps = [];
  s.pairs.forEach((p,pi)=>{
    for(let r=1; r<=p.rounds; r++){
      p.ex.forEach((e,ei)=>{
        steps.push({type:"set", ex:e, pair:p.id, round:r, rounds:p.rounds});
        const lastOfAll = (pi===s.pairs.length-1) && (r===p.rounds) && (ei===p.ex.length-1);
        if(!lastOfAll) steps.push({type:"rest", sec: ei===0 ? SWITCH : p.rest,
          next: ei===0 ? p.ex[1] : (r<p.rounds ? p.ex[0] : s.pairs[pi+1].ex[0])});
      });
    }
  });
  return steps;
}

let WL = null;
async function keepAwake(on){
  try{
    if(on){
      if(!WL && "wakeLock" in navigator){
        WL = await navigator.wakeLock.request("screen");
        WL.addEventListener("release", () => { WL = null; });
      }
    } else if(WL){ await WL.release(); WL = null; }
  }catch(e){ WL = null }
}
// iOS gibt die Sperre beim Wegschalten frei — beim Zurückkommen neu anfordern
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && run) keepAwake(true);
});

/* ---------- Pulsgurt ----------
   Standard-BLE-Profil: Service "heart_rate" (0x180D),
   Characteristic "heart_rate_measurement" (0x2A37).
   Jeder normgerechte Brustgurt und die meisten Uhren senden darüber.
   navigator.bluetooth gibt es in Safari auf dem iPhone nicht — die
   Knöpfe erscheinen daher nur, wo die Schnittstelle vorhanden ist. */
const hasBLE = () => typeof navigator !== "undefined" && !!navigator.bluetooth;
let HR = {dev:null, chr:null, bpm:null, samples:[]};

async function connectHR(){
  if(!hasBLE()) return;
  try{
    const dev = await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService("heart_rate");
    const chr = await svc.getCharacteristic("heart_rate_measurement");
    await chr.startNotifications();
    chr.addEventListener("characteristicvaluechanged", e => {
      const v = e.target.value, flags = v.getUint8(0);
      // Bit 0 der Flags: 0 = 8-Bit-Wert, 1 = 16-Bit-Wert
      HR.bpm = (flags & 1) ? v.getUint16(1, true) : v.getUint8(1);
      if(run && run.mode === "cardio") HR.samples.push(HR.bpm);
      paintHR();
    });
    dev.addEventListener("gattserverdisconnected", () => { HR.bpm = null; paintHR() });
    HR.dev = dev; HR.chr = chr;
    paintHR();
  }catch(e){ /* Nutzer hat abgebrochen oder kein Gerät gefunden */ }
}
function disconnectHR(){
  try{ HR.chr && HR.chr.stopNotifications(); HR.dev && HR.dev.gatt.disconnect(); }catch(e){}
  HR = {dev:null, chr:null, bpm:null, samples:[]};
}
function hrZoneState(bpm){
  if(!run || run.mode !== "cardio") return "";
  const p = CARDIO[run.kind].pct, m = hrMax();
  if(!m || !bpm) return "";
  if(bpm < m*p[0]) return "low";
  if(bpm > m*p[1]) return "high";
  return "in";
}
function paintHR(){
  const el = document.getElementById("hrLive"); if(!el) return;
  if(HR.bpm == null){ el.className = "hrlive off"; el.innerHTML = `<b>—</b><span>kein Signal</span>`; return }
  const st = hrZoneState(HR.bpm);
  const txt = {low:"zu langsam", in:"in der Zone", high:"zu schnell"}[st] || "Puls";
  el.className = "hrlive " + st;
  el.innerHTML = `<b>${HR.bpm}</b><span>${txt}</span>`;
}

function startCardio(kind, min){
  const c = CARDIO[kind], band = hrBand(c.pct);
  const dur = min || (kind==="int" ? 0 : 40);
  audio(); keepAwake(true);
  run = {mode:"cardio", kind, dur, t0:Date.now(), left: dur*60};
  R.classList.remove("hide"); document.body.style.overflow="hidden";
  R.innerHTML = `<div class="rbar"><i style="width:0%"></i></div>
    <div class="rtop"><button class="eyebrow" onclick="endCardio()">Beenden</button>
      <span class="eyebrow">${c.name}</span></div>
    <div class="rmid">
      <div class="lbl">${dur?"Zielzeit "+dur+" min":"Freie Dauer"}</div>
      <div class="clock" id="clk">0:00</div>
      ${band?`<div class="target">Zielpuls ${band}</div>`:""}
      <div class="hrlive off" id="hrLive"><b>—</b><span>kein Signal</span></div>
      <div class="next" style="max-width:320px">${c.regel}</div>
    </div>
    <div class="rbot">
      ${hasBLE()?`<button class="skip" onclick="${HR.dev?"disconnectHR()":"connectHR()"}">${HR.dev?"Pulsgurt trennen":"Pulsgurt verbinden"}</button>`:""}
      <button class="go" onclick="endCardio()">Fertig — Zeit eintragen</button></div>`;
  paintHR();
  tick = setInterval(()=>{
    const el = Date.now()-run.t0, s2 = Math.floor(el/1000);
    const c2 = document.getElementById("clk"); if(!c2){ clearInterval(tick); return }
    c2.textContent = fmt(s2);
    if(dur){ const p = Math.min(100, s2/(dur*60)*100);
      R.querySelector(".rbar i").style.width = p+"%";
      if(s2 >= dur*60 && !run.done){ run.done = true; buzz(); c2.classList.add("soon"); } }
  },1000);
}
function endCardio(){
  clearInterval(tick); tick = null;
  const min = Math.round((Date.now() - run.t0) / 60000);
  const kind = run.kind;
  if(min < 5){                              // zu kurz: nichts protokollieren
    HR.samples = []; keepAwake(false); run = null;
    R.classList.add("hide"); document.body.style.overflow = ""; render(); return;
  }
  let hr = null, hrmax = null;
  if(HR.samples.length){                    // Pulsgurt hat gemessen
    hr = Math.round(HR.samples.reduce((a,b)=>a+b,0) / HR.samples.length);
    hrmax = Math.max(...HR.samples);
  }
  run = {mode:"cardioEnd", kind, min, hr, hrmax, t0:run.t0};
  const m = hrMax(), band = hrBand(CARDIO[kind].pct);
  R.innerHTML = `<div class="rtop"><span class="eyebrow">${CARDIO[kind].name} beendet</span></div>
    <div class="sheet">
      <div class="exname" style="font-size:30px">${min} Minuten</div>
      ${hr ? `<div class="hrlive in" style="margin:18px 0"><b>${hr}</b><span>Ø Puls gemessen${hrmax?` · Spitze ${hrmax}`:""}</span></div>`
           : `<p class="muted" style="font-size:14px;margin:16px 0 4px">Durchschnittspuls dieser Einheit?
              Deine Uhr zeigt ihn nach dem Beenden der Aufzeichnung an. Feld leer lassen, wenn du nicht gemessen hast.</p>
              <div class="field"><label>Ø Puls (S/min)${band?" · Ziel "+band:""}</label>
                <input id="hrIn" type="number" inputmode="numeric" placeholder="—"></div>`}
      <button class="go" style="margin-top:18px" onclick="saveCardio()">Speichern</button>
      <p class="muted" style="font-size:12px;margin-top:14px">Gleiche Belastung bei sinkendem Puls über die Wochen ist der sauberste Beleg für bessere Ausdauer — unabhängig von der Waage.</p>
    </div>`;
}
function saveCardio(){
  let hr = run.hr;
  if(!hr){
    const v = parseInt((document.getElementById("hrIn")?.value || "").trim());
    if(v > 40 && v < 230) hr = v;
  }
  logCardio(run.kind, run.min, hr, run.hrmax);
  HR.samples = []; keepAwake(false); run = null;
  R.classList.add("hide"); document.body.style.overflow = ""; render();
}
function logCardio(t, min, hr, hrmax){
  cardioLog.push({d:iso(today()), t, min, ...(hr?{hr}:{}), ...(hrmax?{hrmax}:{})});
  DB.set("cardio", cardioLog.slice(-120));
}

function startMob(){
  const steps = [];
  MOB.forEach((x,i) => {
    steps.push({type:"hold", ex:x});
    if(i < MOB.length-1) steps.push({type:"rest", sec:MOB_SWITCH, next:MOB[i+1]});
  });
  audio(); keepAwake(true);
  run = {mode:"mob", steps, i:0, t0:Date.now()};
  R.classList.remove("hide"); document.body.style.overflow="hidden";
  drawMob();
}
function drawMob(){
  clearInterval(tick); tick=null;
  if(run.i >= run.steps.length){
    logCardio("mob", Math.max(1, Math.round((Date.now()-run.t0)/60000)));
    clearInterval(tick); run=null; keepAwake(false); R.classList.add("hide");
    document.body.style.overflow=""; render(); return;
  }
  const st = run.steps[run.i];
  const pct = Math.round(run.i/run.steps.length*100);
  const top = `<div class="rbar"><i style="width:${pct}%"></i></div>
    <div class="rtop"><button class="eyebrow" onclick="endMob()">Beenden</button>
      <span class="eyebrow num">Mobility · ${Math.ceil((run.i+1)/2)} von ${MOB.length}</span></div>`;
  if(st.type === "hold"){
    run.left = st.ex.sec;
    R.innerHTML = top + `<div class="rmid">
        <div class="exname" style="font-size:30px">${st.ex.n}</div>
        <div class="clock" id="clk" style="font-size:60px;margin-top:10px">${fmt(st.ex.sec)}</div>
        <div class="next" style="max-width:330px">${st.ex.c}</div>
        ${queueHTML(run.i+1)}
      </div>
      <div class="rbot"><button class="go ghost" onclick="run.i++;drawMob()">Weiter</button></div>`;
  } else {
    run.left = st.sec;
    R.innerHTML = top + `<div class="rmid">
        <div class="lbl">Wechsel</div>
        <div class="clock" id="clk">${fmt(st.sec)}</div>
        <div class="next">Als Nächstes<br><b>${st.next.n}</b></div>
      </div>
      <div class="rbot"><button class="go ghost" onclick="run.i++;drawMob()">Weiter</button></div>`;
  }
  tick = setInterval(()=>{
    run.left--;
    const c = document.getElementById("clk");
    if(!c){ clearInterval(tick); return }
    c.textContent = fmt(run.left);
    if(run.left <= 5) c.classList.add("soon");
    if(run.left === 5 && st.type === "hold") warn();
    if(run.left <= 0){ clearInterval(tick); buzz(); run.i++; drawMob(); }
  },1000);
}
function endMob(){
  clearInterval(tick); tick=null;
  const min = Math.round((Date.now()-run.t0)/60000);
  if(min >= 3) logCardio("mob", min);
  keepAwake(false); run=null; R.classList.add("hide"); document.body.style.overflow=""; render();
}

// Nächster noch nicht übersprungener Satz ab Position from
function nextSet(from){
  for(let j = from; j < run.steps.length; j++){
    const st = run.steps[j];
    if(st.type === "set" && !run.skip.has(st.ex.n)) return st.ex;
  }
  return null;
}
// Zeiger vorrücken, bis er auf etwas Sinnvollem steht
function advance(){
  while(run.i < run.steps.length){
    const st = run.steps[run.i];
    if(st.type === "set" && run.skip.has(st.ex.n)){ run.i++; continue }
    if(st.type === "rest" && !nextSet(run.i + 1)){ run.i++; continue }
    break;
  }
}
function askSkip(){
  clearInterval(tick); tick = null;
  const st = run.steps[run.i];
  const rest = run.steps.filter((x,j) => j >= run.i && x.type === "set" && x.ex.n === st.ex.n).length;
  R.innerHTML = `<div class="rtop"><button class="eyebrow" onclick="drawRun()">Zurück</button>
      <span class="eyebrow">Überspringen</span></div>
    <div class="sheet">
      <div class="exname" style="font-size:24px;margin-bottom:4px">${st.ex.n}</div>
      <p class="muted" style="font-size:13.5px;margin-bottom:18px">Noch ${rest} ${rest===1?"Satz":"Sätze"} offen. Warum?</p>
      ${st.ex.alt && !run.swap[st.ex.n] ? `<button class="reason swap" onclick="doSwap()">
         <b>Stattdessen: ${st.ex.alt.n}</b><br><span>gleiche Sätze, Gewicht wird vorgeschlagen</span></button>` : ""}
      ${REASONS.map(r => `<button class="reason${r.warn?" warn":""}" onclick="doSkip('${r.id}')">${r.t}</button>`).join("")}
      <p class="muted" style="font-size:12px;margin-top:16px">Der Grund landet im Bericht — daraus lässt sich erkennen, ob der Plan angepasst werden muss.</p>
    </div>`;
}
function doSwap(){
  const st = run.steps[run.i];
  const a = st.ex.alt;
  run.swap[st.ex.n] = {n:a.n, t:st.ex.t, w:a.w, k:a.k, inc:a.inc};
  skipLog.push({d:iso(today()), k:run.key, ex:st.ex.n, reason:"ersetzt", sets:0, alt:a.n});
  DB.set("skips", skipLog.slice(-200));
  drawRun();
}
function doSkip(reason){
  const st = run.steps[run.i];
  const rest = run.steps.filter((x,j) => j >= run.i && x.type === "set" && x.ex.n === st.ex.n).length;
  skipLog.push({d:iso(today()), k:run.key, ex:st.ex.n, reason, sets:rest});
  DB.set("skips", skipLog.slice(-200));
  run.skip.add(st.ex.n);
  if(reason === "schmerz"){
    R.innerHTML = `<div class="rtop"><span class="eyebrow">Notiert</span></div>
      <div class="sheet">
        <div class="exname" style="font-size:22px">Beschwerden ernst nehmen</div>
        <p class="muted" style="font-size:14px;margin-top:14px">Richtig, die Übung heute auszulassen.
        Bei Schmerz gilt: nicht durchziehen und nicht in der nächsten Einheit einfach wieder probieren.
        Halten die Beschwerden über mehr als zwei Einheiten an oder strahlen sie aus, gehört das ärztlich abgeklärt —
        nicht in einen Trainingsplan.</p>
        <button class="go" style="margin-top:20px" onclick="run.i++;advance();drawRun()">Weiter</button>
      </div>`;
    return;
  }
  run.i++; advance(); drawRun();
}

function startRun(key){
  audio(); keepAwake(true);
  run = {mode:"kraft", key, steps:buildSteps(key), i:0, left:0, t0:Date.now(), skip:new Set(), swap:{}};
  R.classList.remove("hide"); document.body.style.overflow="hidden";
  drawRun();
}
function endRun(){
  clearInterval(tick); tick=null; run=null; keepAwake(false);
  R.classList.add("hide"); document.body.style.overflow=""; render();
}
function nextStep(rir){
  const st = run.steps[run.i];
  if(st && st.type==="set"){
    const ex = run.swap[st.ex.n] || st.ex;
    const w = parseFloat((document.getElementById("sw")?.value||"").replace(",","."));
    const r = parseInt(document.getElementById("sr")?.value||"");
    if(w>0 && r>0){
      const d = iso(today());
      const prev = lifts[ex.n] || {};
      const h = (prev.h || []);
      h.push({d, w, r, rir: rir ?? 2});
      lifts[ex.n] = {w, r, rir: rir ?? 2, date:d, h: h.slice(-40)};
      DB.set("lifts",lifts);
      const done = DB.get("done",[]);
      if(!done.some(x => x.d===d && x.k===run.key)){ done.push({d, k:run.key}); DB.set("done", done); }
    }
  }
  run.i++; advance();
  if(run.i >= run.steps.length){ endRun(); return }
  drawRun();
}
function drawRun(){
  clearInterval(tick); tick=null;
  advance();
  if(run.i >= run.steps.length){ endRun(); return }
  const st = run.steps[run.i];
  const pct = Math.round(run.i/run.steps.length*100);
  const mins = Math.floor((Date.now()-run.t0)/60000);
  const top = `<div class="rbar"><i style="width:${pct}%"></i></div>
    <div class="rtop"><button class="eyebrow" onclick="endRun()">Beenden</button>
      <span class="eyebrow num">${mins} min · Einheit ${run.key}${WL?' <span class="wl">· Display an</span>':''}</span></div>`;

  if(st.type==="set"){
    const ex = run.swap[st.ex.n] || st.ex;
    const sg = suggest(ex);
    const dl = isDeload();
    R.innerHTML = top + `<div class="rmid">
        <div class="lbl">Paar ${st.pair} · Runde ${st.round} von ${st.rounds}${dl?" · Deload":""}</div>
        <div class="exname">${ex.n}</div>
        <div class="target">${ex.t}${dl?" · halbe Sätze, 3–4 RIR":""}</div>
        ${queueHTML(run.i+1)}
      </div>
      <div class="rbot">
        <div class="logrow">
          <div class="field"><label>Gewicht kg</label>
            <input id="sw" type="number" step="0.5" inputmode="decimal"
              value="${sg.w ?? ""}" oninput="plates()"></div>
          <div class="field"><label>Wiederholungen</label>
            <input id="sr" type="number" inputmode="numeric" value=""></div>
        </div>
        <div class="last" id="plt"></div>
        <div class="last ${sg.up?"up":""}${sg.down?" down":""}">${
          sg.up ? `↑ steigern — ${sg.why}` : sg.down ? `↓ ${sg.why}` : sg.why}</div>
        <div class="rir">
          <button onclick="nextStep(3)"><b>ging leicht</b><span>3+ RIR</span></button>
          <button onclick="nextStep(2)"><b>passte</b><span>2 RIR</span></button>
          <button onclick="nextStep(0)"><b>war Grenze</b><span>0–1 RIR</span></button>
        </div>
        <button class="skip" onclick="askSkip()">Überspringen oder tauschen</button>
      </div>`;
    plates();
  } else {
    run.left = st.sec;
    R.innerHTML = top + `<div class="rmid">
        <div class="lbl">${st.sec<=SWITCH?"Wechsel":"Pause"}</div>
        <div class="clock" id="clk">${fmt(st.sec)}</div>
        <div class="next">Als Nächstes<br><b>${(() => { const x = nextSet(run.i+1); return x ? ((run.swap && run.swap[x.n]) ? run.swap[x.n].n : x.n) : "—" })()}</b></div>
        ${queueHTML(run.i+1)}
      </div>
      <div class="rbot"><button class="go ghost" onclick="nextStep()">Weiter</button></div>`;
    tick = setInterval(()=>{
      run.left--;
      const c = document.getElementById("clk");
      if(!c){ clearInterval(tick); return }
      c.textContent = fmt(run.left);
      if(run.left<=10) c.classList.add("soon");
      if(run.left===5) warn();
      if(run.left<=0){ clearInterval(tick); buzz(); nextStep(); }
    },1000);
  }
}
const fmt = s => (s<0?0:Math.floor(s/60))+":"+String(Math.max(0,s)%60).padStart(2,"0");

// Restliche Sätze ab Position i — nach Übung zusammengefasst.
// Bei Supersätzen wechselt die Reihenfolge ständig; jeder Satz einzeln
// aufgelistet wäre in kleiner Schrift unlesbar.
function queue(from){
  const out = [], idx = {};
  for(let j = from; j < run.steps.length; j++){
    const st = run.steps[j];
    if(st.type !== "set" && st.type !== "hold") continue;
    let n = st.ex.n;
    if(run.skip && run.skip.has(n)) continue;
    if(run.swap && run.swap[n]) n = run.swap[n].n;
    if(idx[n] === undefined){ idx[n] = out.length; out.push({n, c:1}); }
    else out[idx[n]].c++;
  }
  return out;
}
function short(n){
  return n.replace(/ \((Langhantel|KH)\)/, "")
          .replace("Rumänisches", "Rum.")
          .replace("Schrägbankdrücken", "Schrägbank")
          .replace("Schulterdrücken stehend", "Schulterdrücken")
          .replace("Bulgarian Split Squat", "Split Squat");
}
function queueHTML(from){
  const q = queue(from);
  if(!q.length) return `<div class="queue"><span class="last-item">letzter Satz der Einheit</span></div>`;
  return `<div class="queue"><span class="qlbl">Danach</span>` + q.map(x =>
    `<span>${short(x.n)}${x.c > 1 ? ` <em>×${x.c}</em>` : ""}</span>`
  ).join('<span class="sep">·</span>') + `</div>`;
}
const BAR = {bar:20, trap:25};
function plates(){
  const box = document.getElementById("plt"); if(!box || !run) return;
  const st = run.steps[run.i]; const ex = run.swap[st.ex.n] || st.ex; const bar = BAR[ex.k];
  const w = parseFloat((document.getElementById("sw")?.value||"").replace(",","."));
  if(!bar || !w || w<=bar){ box.textContent = bar&&w?`Nur die Stange (${bar} kg)`:""; return }
  let side = (w-bar)/2, out = [];
  for(const p of [25,20,15,10,5,2.5,1.25]){
    const n = Math.floor(side/p + 1e-9);
    if(n){ out.push(n>1?`${n}×${p}`:`${p}`); side -= n*p; }
  }
  box.textContent = `Pro Seite: ${out.join(" + ")}` + (side>0.05?` (+${side.toFixed(2)} kg fehlen)`:"");
}
let AC = null;
const VOLS = {leise:.20, mittel:.45, laut:.90};
function audio(){
  try{
    if(!AC){
      // Muss VOR dem Anlegen des Kontexts gesetzt werden.
      // "transient" = kurzer Signalton, der laufende Musik anduckt
      // statt sie zu unterbrechen oder selbst stumm zu bleiben.
      if(navigator.audioSession) navigator.audioSession.type = "transient";
      AC = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(AC.state === "suspended") AC.resume();
    return AC;
  }catch(e){ return null }
}
function tone(freq, dur, vol){
  if(DB.get("mute", false)) return;
  const a = audio(); if(!a) return;
  const lvl = VOLS[DB.get("vol","mittel")] ?? VOLS.mittel;
  const bus = a.createGain(); bus.connect(a.destination);
  const t = a.currentTime, peak = Math.min(.95, vol * lvl * 2.2);
  bus.gain.setValueAtTime(.0001, t);
  bus.gain.exponentialRampToValueAtTime(peak, t + .012);
  bus.gain.exponentialRampToValueAtTime(.0001, t + dur);
  // Grundton als Rechteck + Oktave als Sinus: setzt sich gegen Musik durch,
  // weil die Obertöne in einem anderen Frequenzband liegen als der Bass.
  [[freq, "square", 1], [freq*2, "sine", .45]].forEach(([f, type, m]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = m;
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + .04);
  });
}
// 5 Sekunden vor Schluss: drei kurze Ticks — "gleich geht es weiter"
function warn(){
  [0, 150, 300].forEach(ms => setTimeout(() => tone(700, .09, .16), ms));
  if(navigator.vibrate) navigator.vibrate(60);
}
// Pausenende: ein langer, deutlich höherer Ton
function buzz(){
  tone(940, .5, .28);
  if(navigator.vibrate) navigator.vibrate([160, 90, 160]);
}

/* =======================================================================
   START
   ======================================================================= */
function go(t){ tab=t; render(); }
function render(){
  app.innerHTML = {heute:viewHeute, plan:viewPlan, essen:viewEssen, werte:viewWerte}[tab]();
  document.querySelectorAll("nav button").forEach(b=>
    b.classList.toggle("on", b.dataset.tab===tab));
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>
  b.onclick = ()=>go(b.dataset.tab));
document.addEventListener("pointerdown", () => audio(), {once:true});
document.addEventListener("visibilitychange", () => { if(!document.hidden) audio(); });
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
